<body class="bg-[#F6F5F0] text-[#1C2520] antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ============================================================================
        // ICONS WRAPPER USING LUCIDE
        // ============================================================================
        const Leaf = (props) => <i data-lucide="leaf" {...props}></i>;
        const Plus = (props) => <i data-lucide="plus" {...props}></i>;
        const Trash2 = (props) => <i data-lucide="trash-2" {...props}></i>;
        const ChevronDown = (props) => <i data-lucide="chevron-down" {...props}></i>;
        const ChevronUp = (props) => <i data-lucide="chevron-up" {...props}></i>;
        const Sparkles = (props) => <i data-lucide="sparkles" {...props}></i>;
        const Check = (props) => <i data-lucide="check" {...props}></i>;
        const Utensils = (props) => <i data-lucide="utensils" {...props}></i>;
        const Clock = (props) => <i data-lucide="clock" {...props}></i>;
        const Menu = (props) => <i data-lucide="menu" {...props}></i>;
        const X = (props) => <i data-lucide="x" {...props}></i>;
        const Sliders = (props) => <i data-lucide="sliders" {...props}></i>;
        const Home = (props) => <i data-lucide="home" {...props}></i>;
        const Scale = (props) => <i data-lucide="scale" {...props}></i>;
        const Loader2 = (props) => <i data-lucide="loader-2" {...props}></i>;

        // ============================================================================
        // CONSTANTS & 14-DAY RETENTION CONFIG
        // ============================================================================
        const STORAGE_KEY_LOGS = 'mindful_nutrition_logs_v3';
        const STORAGE_KEY_WEIGHTS = 'mindful_nutrition_weights_v3';
        const STORAGE_KEY_TARGETS = 'mindful_nutrition_targets_v3';
        const FOURTEEN_DAYS_MS = 14 * 24 * 60 * 60 * 1000;
        const ONE_DAY_MS = 24 * 60 * 60 * 1000;

        const DEFAULT_TARGETS = {
            calories: 2100,
            protein: 135,
            carbs: 210,
            fat: 75,
            saturatedFat: 20,
            sodium: 2300,
            cholesterol: 300
        };

        const MEAL_TYPES = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];

        const COOKING_STYLES = [
            'Scrambled / Pan-Fried',
            'Grilled / Roasted',
            'Boiled / Poached',
            'Baked',
            'Steamed',
            'Raw / As-Is'
        ];

        const SAMPLE_BREAKFAST = {
            mealType: 'Breakfast',
            cookingStyle: 'Scrambled / Pan-Fried',
            ingredientsText: '6 extra-large eggs, 1/3 lb bacon, 5 slices American cheese, 3 tbsp butter, 2 slices white bread'
        };

        // ============================================================================
        // DATE HELPERS
        // ============================================================================
        function getDateKey(timestamp = Date.now()) {
            const d = new Date(timestamp);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatReadableDate(dateKey) {
            const todayKey = getDateKey(Date.now());
            const yesterdayKey = getDateKey(Date.now() - ONE_DAY_MS);
            if (dateKey === todayKey) return 'Today';
            if (dateKey === yesterdayKey) return 'Yesterday';

            const [y, m, d] = dateKey.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            return dateObj.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }

        // ============================================================================
        // CULINARY FALLBACK & INSTANT REFERENCE ENGINE
        // ============================================================================
        function calculateFallbackAnalysis({ mealType, cookingStyle, ingredientsText }) {
            const normalized = ingredientsText.toLowerCase();

            if (
                normalized.includes('6') &&
                normalized.includes('egg') &&
                normalized.includes('bacon') &&
                normalized.includes('cheese')
            ) {
                const ingredients = [
                    { ingredient: '6 extra-large eggs', note: 'Scrambled curds absorb melted cooking butter', calories: 480, protein: 42, carbs: 2.4, fat: 32.4, saturatedFat: 10.2, cholesterol: 1260, sodium: 420 },
                    { ingredient: '1/3 lb bacon (pan-fried)', note: 'Pan-frying renders out ~68% of raw fat into the skillet', calories: 265, protein: 18.5, carbs: 0.7, fat: 20.5, saturatedFat: 6.9, cholesterol: 55, sodium: 890 },
                    { ingredient: '5 slices American cheese', note: 'Melted directly into scramble', calories: 390, protein: 18, carbs: 5, fat: 33, saturatedFat: 19.2, cholesterol: 100, sodium: 1600 },
                    { ingredient: '3 tbsp salted butter', note: 'Absorbed into scrambled eggs and toast', calories: 306, protein: 0.4, carbs: 0, fat: 34.5, saturatedFat: 21.6, cholesterol: 92, sodium: 273 },
                    { ingredient: '2 slices white bread', note: 'Toasted', calories: 150, protein: 5, carbs: 28, fat: 2, saturatedFat: 0.4, cholesterol: 0, sodium: 290 }
                ];
                const totals = sumIngredients(ingredients);
                return {
                    mealTitle: 'Scrambled Eggs, Bacon, Cheese & Toast',
                    mealType,
                    cookingStyle,
                    cookingImpactNote: 'Scrambling the eggs absorbed nearly all 3 tbsp of melted butter (+306 kcal), while pan-frying the bacon rendered out about two-thirds of its raw fat into the pan.',
                    totals,
                    ingredients
                };
            }

            const parts = ingredientsText.split(/,|\n/).map(s => s.trim()).filter(Boolean);
            const styleMultiplier = cookingStyle === 'Scrambled / Pan-Fried' ? 1.12 : cookingStyle === 'Grilled / Roasted' ? 0.95 : 1.0;

            const ingredients = parts.map(part => {
                const low = part.toLowerCase();
                const numMatch = low.match(/(\d+(\.\d+)?)/);
                const qty = numMatch ? parseFloat(numMatch[1]) : 1;

                if (low.includes('egg')) {
                    return { ingredient: part, note: cookingStyle, calories: Math.round(qty * 78 * styleMultiplier), protein: +(qty * 6.5).toFixed(1), carbs: +(qty * 0.5).toFixed(1), fat: +(qty * 5.3 * styleMultiplier).toFixed(1), saturatedFat: +(qty * 1.6 * styleMultiplier).toFixed(1), cholesterol: Math.round(qty * 195), sodium: Math.round(qty * 68) };
                }
                if (low.includes('butter') || low.includes('oil')) {
                    return { ingredient: part, note: 'Cooking fat retained on food', calories: Math.round(qty * 102), protein: 0, carbs: 0, fat: +(qty * 11.5).toFixed(1), saturatedFat: low.includes('butter') ? +(qty * 7.2).toFixed(1) : +(qty * 1.8).toFixed(1), cholesterol: low.includes('butter') ? Math.round(qty * 31) : 0, sodium: low.includes('butter') ? Math.round(qty * 90) : 0 };
                }
                if (low.includes('bacon') || low.includes('sausage')) {
                    return { ingredient: part, note: `${cookingStyle} (rendered excess fat)`, calories: 260, protein: 18, carbs: 1, fat: 20, saturatedFat: 6.8, cholesterol: 55, sodium: 860 };
                }
                if (low.includes('cheese')) {
                    return { ingredient: part, note: 'Melted', calories: Math.round(qty * 78), protein: +(qty * 3.6).toFixed(1), carbs: +(qty * 1.0).toFixed(1), fat: +(qty * 6.5).toFixed(1), saturatedFat: +(qty * 3.8).toFixed(1), cholesterol: Math.round(qty * 20), sodium: Math.round(qty * 310) };
                }
                if (low.includes('bread') || low.includes('toast') || low.includes('rice') || low.includes('oat')) {
                    return { ingredient: part, note: cookingStyle, calories: Math.round(qty * 80), protein: +(qty * 2.8).toFixed(1), carbs: +(qty * 15).toFixed(1), fat: +(qty * 1).toFixed(1), saturatedFat: +(qty * 0.2).toFixed(1), cholesterol: 0, sodium: Math.round(qty * 140) };
                }
                if (low.includes('chicken') || low.includes('salmon') || low.includes('steak') || low.includes('beef')) {
                    return { ingredient: part, note: cookingStyle, calories: Math.round(310 * styleMultiplier), protein: 38, carbs: 0, fat: +(16 * styleMultiplier).toFixed(1), saturatedFat: +(4.8 * styleMultiplier).toFixed(1), cholesterol: 105, sodium: 280 };
                }

                return { ingredient: part, note: cookingStyle, calories: Math.round(140 * styleMultiplier), protein: 6, carbs: 14, fat: +(6 * styleMultiplier).toFixed(1), saturatedFat: 1.5, cholesterol: 15, sodium: 190 };
            });

            const totals = sumIngredients(ingredients);
            return {
                mealTitle: `${cookingStyle} ${mealType}`,
                mealType,
                cookingStyle,
                cookingImpactNote: `Prepared ${cookingStyle.toLowerCase()}, adjusting final calorie and lipid retention across ${ingredients.length} ingredients.`,
                totals,
                ingredients
            };
        }

        function sumIngredients(ingredients) {
            return ingredients.reduce((acc, item) => ({
                calories: Math.round(acc.calories + (Number(item.calories) || 0)),
                protein: +(acc.protein + (Number(item.protein) || 0)).toFixed(1),
                carbs: +(acc.carbs + (Number(item.carbs) || 0)).toFixed(1),
                fat: +(acc.fat + (Number(item.fat) || 0)).toFixed(1),
                saturatedFat: +(acc.saturatedFat + (Number(item.saturatedFat) || 0)).toFixed(1),
                cholesterol: Math.round(acc.cholesterol + (Number(item.cholesterol) || 0)),
                sodium: Math.round(acc.sodium + (Number(item.sodium) || 0))
            }), { calories: 0, protein: 0, carbs: 0, fat: 0, saturatedFat: 0, cholesterol: 0, sodium: 0 });
        }

        // ============================================================================
        // GEMINI API STRUCTURED NUTRITION ANALYZER
        // ============================================================================
        async function analyzeMealWithGemini({ mealType, cookingStyle, ingredientsText }) {
            const apiKey = '';
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemInstruction = `You are a mindful culinary nutritionist.
Given a list of ingredients and a cooking style, calculate accurate nutrition facts.
Account for culinary preparation effects:
- Pan-frying raw bacon renders out ~65-70% of its raw fat into the pan.
- Scrambling eggs in butter causes porous egg curds to absorb ~95-100% of the melted butter.
- Keep 'cookingImpactNote' to a single concise, calm sentence explaining how the cooking method influenced macros.
- Ensure 'totals' equals the exact sum of the 'ingredients' list.`;

            const userQuery = `Meal Type: ${mealType}\nCooking Style: ${cookingStyle}\nIngredients: ${ingredientsText}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: {
                    responseMimeType: 'application/json',
                    responseSchema: {
                        type: 'OBJECT',
                        properties: {
                            mealTitle: { type: 'STRING' },
                            cookingImpactNote: { type: 'STRING' },
                            totals: {
                                type: 'OBJECT',
                                properties: {
                                    calories: { type: 'NUMBER' },
                                    protein: { type: 'NUMBER' },
                                    carbs: { type: 'NUMBER' },
                                    fat: { type: 'NUMBER' },
                                    saturatedFat: { type: 'NUMBER' },
                                    cholesterol: { type: 'NUMBER' },
                                    sodium: { type: 'NUMBER' }
                                },
                                required: ['calories', 'protein', 'carbs', 'fat', 'saturatedFat', 'cholesterol', 'sodium']
                            },
                            ingredients: {
                                type: 'ARRAY',
                                items: {
                                    type: 'OBJECT',
                                    properties: {
                                        ingredient: { type: 'STRING' },
                                        note: { type: 'STRING' },
                                        calories: { type: 'NUMBER' },
                                        protein: { type: 'NUMBER' },
                                        carbs: { type: 'NUMBER' },
                                        fat: { type: 'NUMBER' },
                                        saturatedFat: { type: 'NUMBER' },
                                        cholesterol: { type: 'NUMBER' },
                                        sodium: { type: 'NUMBER' }
                                    },
                                    required: ['ingredient', 'note', 'calories', 'protein', 'carbs', 'fat', 'saturatedFat', 'cholesterol', 'sodium']
                                }
                            }
                        },
                        required: ['mealTitle', 'cookingImpactNote', 'totals', 'ingredients']
                    }
                }
            };

            const delays = [1000, 2000, 4000];
            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const result = await response.json();
                    const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawJson) throw new Error('Empty response');

                    const parsed = JSON.parse(rawJson);
                    return {
                        mealTitle: parsed.mealTitle || `${cookingStyle} ${mealType}`,
                        mealType,
                        cookingStyle,
                        cookingImpactNote: parsed.cookingImpactNote,
                        totals: sumIngredients(parsed.ingredients || []),
                        ingredients: parsed.ingredients || []
                    };
                } catch (e) {
                    if (attempt < delays.length) {
                        await new Promise(r => setTimeout(r, delays[attempt]));
                    } else {
                        return calculateFallbackAnalysis({ mealType, cookingStyle, ingredientsText });
                    }
                }
            }
        }

        // ============================================================================
        // KEY CONTRIBUTING FACTORS SYNTHESIS
        // ============================================================================
        function buildKeyContributingFactors(meals) {
            if (!meals || meals.length === 0) return [];
            const allItems = [];
            meals.forEach(meal => {
                (meal.ingredients || []).forEach(ing => {
                    allItems.push({ ...ing, cookingStyle: meal.cookingStyle });
                });
            });

            if (allItems.length === 0) return [];
            const totals = sumIngredients(allItems);
            const byCal = [...allItems].sort((a, b) => b.calories - a.calories);
            const byPro = [...allItems].sort((a, b) => b.protein - a.protein);
            const bySatFat = [...allItems].sort((a, b) => b.saturatedFat - a.saturatedFat);
            const bySodium = [...allItems].sort((a, b) => b.sodium - a.sodium);

            const takeaways = [];
            if (byCal[0] && byPro[0]) {
                const calPct = totals.calories > 0 ? Math.round((byCal[0].calories / totals.calories) * 100) : 0;
                if (byCal[0].ingredient === byPro[0].ingredient) {
                    takeaways.push({
                        label: 'Primary Energy & Protein Source',
                        detail: `${byCal[0].ingredient} anchors your intake with ${byCal[0].calories} kcal (${calPct}% of calories) and ${byPro[0].protein}g of protein.`
                    });
                } else {
                    takeaways.push({
                        label: 'Calorie & Protein Balance',
                        detail: `${byCal[0].ingredient} is the largest energy source (${byCal[0].calories} kcal), while ${byPro[0].ingredient} leads protein intake (${byPro[0].protein}g).`
                    });
                }
            }

            if (bySatFat[0] && bySatFat[0].saturatedFat > 0) {
                const secondSat = bySatFat[1] && bySatFat[1].saturatedFat > 3 ? ` and ${bySatFat[1].ingredient} (${bySatFat[1].saturatedFat}g)` : '';
                takeaways.push({
                    label: 'Cooking Fat & Lipid Impact',
                    detail: `${bySatFat[0].ingredient} (${bySatFat[0].saturatedFat}g sat. fat)${secondSat} account for the majority of saturated fat through ${bySatFat[0].cookingStyle.toLowerCase()} preparation.`
                });
            }

            if (bySodium[0] && bySodium[0].sodium > 0) {
                const sodPct = totals.sodium > 0 ? Math.round((bySodium[0].sodium / totals.sodium) * 100) : 0;
                const secondSod = bySodium[1] && bySodium[1].sodium > 300 ? `, followed by ${bySodium[1].ingredient} (${bySodium[1].sodium}mg)` : '';
                takeaways.push({
                    label: 'Primary Sodium Contributor',
                    detail: `${bySodium[0].ingredient} contributes ${bySodium[0].sodium}mg of sodium (${sodPct}% of today's total)${secondSod}.`
                });
            }

            return takeaways.slice(0, 3);
        }

        // ============================================================================
        // MAIN APPLICATION COMPONENT
        // ============================================================================
        function App() {
            const [activeTab, setActiveTab] = useState('today');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [mealLogs, setMealLogs] = useState([]);
            const [weightLogs, setWeightLogs] = useState([]);
            const [targets, setTargets] = useState(DEFAULT_TARGETS);

            // Goals Form State
            const [goalCalories, setGoalCalories] = useState(String(DEFAULT_TARGETS.calories));
            const [goalProtein, setGoalProtein] = useState(String(DEFAULT_TARGETS.protein));
            const [goalCarbs, setGoalCarbs] = useState(String(DEFAULT_TARGETS.carbs));
            const [goalFat, setGoalFat] = useState(String(DEFAULT_TARGETS.fat));
            const [goalSatFat, setGoalSatFat] = useState(String(DEFAULT_TARGETS.saturatedFat));
            const [goalSodium, setGoalSodium] = useState(String(DEFAULT_TARGETS.sodium));
            const [goalCholesterol, setGoalCholesterol] = useState(String(DEFAULT_TARGETS.cholesterol));
            const [goalSavedMessage, setGoalSavedMessage] = useState(false);

            // Weight Log State
            const [currentWeightInput, setCurrentWeightInput] = useState('');
            const [weightUnit, setWeightUnit] = useState('lbs');

            // Expansion toggles
            const [expandedMealId, setExpandedMealId] = useState(null);
            const [expandedHistoryDate, setExpandedHistoryDate] = useState(null);

            // Log Meal State
            const [mealType, setMealType] = useState('Breakfast');
            const [cookingStyle, setCookingStyle] = useState('Scrambled / Pan-Fried');
            const [ingredientsText, setIngredientsText] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [previewMeal, setPreviewMeal] = useState(null);

            // 14-Day Rolling Prune Engine for Meals & Weights
            const pruneExpiredLogs = useCallback((logs) => {
                const cutoff = Date.now() - FOURTEEN_DAYS_MS;
                const valid = (logs || []).filter(entry => {
                    const ts = typeof entry.timestamp === 'number' ? entry.timestamp : new Date(entry.dateKey).getTime();
                    return ts >= cutoff;
                });
                try {
                    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(valid));
                } catch (e) {}
                return valid;
            }, []);

            const pruneExpiredWeights = useCallback((weights) => {
                const cutoff = Date.now() - FOURTEEN_DAYS_MS;
                const valid = (weights || []).filter(entry => {
                    const ts = typeof entry.timestamp === 'number' ? entry.timestamp : new Date(entry.dateKey).getTime();
                    return ts >= cutoff;
                });
                try {
                    localStorage.setItem(STORAGE_KEY_WEIGHTS, JSON.stringify(valid));
                } catch (e) {}
                return valid;
            }, []);

            useEffect(() => {
                try {
                    const savedTargets = localStorage.getItem(STORAGE_KEY_TARGETS);
                    if (savedTargets) {
                        const parsed = { ...DEFAULT_TARGETS, ...JSON.parse(savedTargets) };
                        setTargets(parsed);
                        setGoalCalories(String(parsed.calories));
                        setGoalProtein(String(parsed.protein));
                        setGoalCarbs(String(parsed.carbs));
                        setGoalFat(String(parsed.fat));
                        setGoalSatFat(String(parsed.saturatedFat));
                        setGoalSodium(String(parsed.sodium));
                        setGoalCholesterol(String(parsed.cholesterol));
                    }

                    const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
                    if (savedLogs) {
                        setMealLogs(pruneExpiredLogs(JSON.parse(savedLogs)));
                    } else {
                        const now = Date.now();
                        const sampleAnalysis = calculateFallbackAnalysis(SAMPLE_BREAKFAST);
                        const initialLogs = [{ id: `meal_${now}`, timestamp: now, dateKey: getDateKey(now), ...sampleAnalysis }];
                        setMealLogs(pruneExpiredLogs(initialLogs));
                    }

                    const savedWeights = localStorage.getItem(STORAGE_KEY_WEIGHTS);
                    if (savedWeights) {
                        setWeightLogs(pruneExpiredWeights(JSON.parse(savedWeights)));
                    } else {
                        const now = Date.now();
                        const initialWeights = [{ id: `wt_${now}`, timestamp: now, dateKey: getDateKey(now), weight: 176.5, unit: 'lbs' }];
                        setWeightLogs(pruneExpiredWeights(initialWeights));
                    }
                } catch (e) {}
            }, [pruneExpiredLogs, pruneExpiredWeights]);

            // Re-run Lucide icon replacement on tab or state changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const todayKey = getDateKey(Date.now());
            const todayMeals = useMemo(() => mealLogs.filter(m => m.dateKey === todayKey), [mealLogs, todayKey]);

                                                        <th className="py-2 px-2 font-medium text-right">Carbs</th>
                                                        <th className="py-2 pl-2 font-medium text-right">Fat</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-[#F0EFEA]">
                                                    {previewMeal.ingredients.map((item, idx) => (
                                                        <tr key={idx} className="text-[#1C2520]">
                                                            <td className="py-2.5 pr-3">
                                                                <div className="font-medium">{item.ingredient}</div>
                                                                {item.note && <div className="text-[11px] text-[#646D67]">{item.note}</div>}
                                                            </td>
                                                            <td className="py-2.5 px-2 text-right font-medium whitespace-nowrap">{item.calories} kcal</td>
                                                            <td className="py-2.5 px-2 text-right text-[#646D67] whitespace-nowrap">{item.protein}g</td>
                                                            <td className="py-2.5 px-2 text-right text-[#646D67] whitespace-nowrap">{item.carbs}g</td>
                                                            <td className="py-2.5 pl-2 text-right text-[#646D67] whitespace-nowrap">{item.fat}g</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="pt-2 flex justify-end">
                                            <button type="button" onClick={handleSavePreviewToToday} className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-[#2D5A43] hover:bg-[#234735] text-white text-xs font-semibold transition flex items-center justify-center gap-1.5">
                                                <Check className="w-4 h-4" />
                                                <span>Save to Today</span>
                                            </button>
                                        </div>
                                    </section>
                                )}
                            </main>
                        )}

                        {/* ================= VIEW 3: DAILY WEIGH-INS ================= */}
                        {activeTab === 'weight' && (
                            <main className="space-y-6">
                                <form onSubmit={handleSaveWeight} className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm space-y-5">
                                    <div>
                                        <h2 className="text-sm font-semibold text-[#1C2520]">Record Today&apos;s Weight</h2>
                                        <p className="text-xs text-[#646D67] mt-0.5">Track body weight trends alongside your 14-day nutrition history</p>
                                    </div>

                                    <div className="flex gap-3">
                                        <div className="flex-1 space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Weight</label>
                                            <input
                                                type="number"
                                                step="0.1"
                                                value={currentWeightInput}
                                                onChange={(e) => setCurrentWeightInput(e.target.value)}
                                                placeholder="e.g. 175.4"
                                                className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                            />
                                        </div>
                                        <div className="w-28 space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Unit</label>
                                            <select
                                                value={weightUnit}
                                                onChange={(e) => setWeightUnit(e.target.value)}
                                                className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                            >
                                                <option value="lbs">lbs</option>
                                                <option value="kg">kg</option>
                                                <option value="st">st</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={!currentWeightInput}
                                        className="w-full py-3 px-4 rounded-xl bg-[#2D5A43] hover:bg-[#234735] disabled:opacity-50 text-white text-xs font-semibold tracking-wide transition flex items-center justify-center gap-2"
                                    >
                                        <Check className="w-4 h-4" />
                                        <span>Save Weigh-In</span>
                                    </button>
                                </form>

                                <section className="space-y-3">
                                    <h2 className="text-xs font-semibold uppercase tracking-wider text-[#646D67] px-1">Weigh-In History (Last 14 Days)</h2>
                                    {sortedWeights.length === 0 ? (
                                        <div className="bg-white rounded-2xl border border-[#E6E4DC] p-8 text-center">
                                            <p className="text-sm text-[#646D67]">No weigh-ins recorded yet.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {sortedWeights.map(w => (
                                                <div key={w.id} className="bg-white rounded-2xl border border-[#E6E4DC] p-4 sm:px-5 flex items-center justify-between text-xs">
                                                    <div>
                                                        <span className="font-semibold text-[#1C2520]">{formatReadableDate(w.dateKey)}</span>
                                                        <span className="text-[#646D67] ml-2">({w.dateKey})</span>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <span className="text-sm font-semibold text-[#2D5A43]">{w.weight} {w.unit}</span>
                                                        <button
                                                            onClick={() => handleDeleteWeight(w.id)}
                                                            className="p-1.5 rounded-lg text-[#646D67] hover:text-[#B55A44] hover:bg-[#F6F5F0] transition"
                                                            title="Delete entry"
                                                        >
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>
                            </main>
                        )}

                        {/* ================= VIEW 4: 14-DAY HISTORY ================= */}
                        {activeTab === 'history' && (
                            <main className="space-y-4">
                                {historyDays.length === 0 ? (
                                    <div className="bg-white rounded-2xl border border-[#E6E4DC] p-8 text-center">
                                        <p className="text-sm text-[#646D67]">No meal history recorded yet.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {historyDays.map(day => {
                                            const isExpanded = expandedHistoryDate === day.dateKey;
                                            return (
                                                <div key={day.dateKey} className="bg-white rounded-2xl border border-[#E6E4DC] overflow-hidden transition">
                                                    <div onClick={() => setExpandedHistoryDate(isExpanded ? null : day.dateKey)} className="p-5 cursor-pointer hover:bg-[#FAF9F6] transition flex items-center justify-between gap-4">
                                                        <div className="space-y-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-sm font-semibold text-[#1C2520]">{day.readableDate}</span>
                                                                <span className="text-xs text-[#646D67]">({day.meals.length} {day.meals.length === 1 ? 'meal' : 'meals'})</span>
                                                            </div>
                                                            <div className="text-xs text-[#646D67] truncate max-w-md">
                                                                {day.meals.map(m => m.mealTitle).join(' • ')}
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4 shrink-0">
                                                            <div className="text-right">
                                                                <div className="text-sm font-semibold text-[#1C2520]">{day.totals.calories.toLocaleString()} kcal</div>
                                                                <div className="text-[11px] text-[#646D67]">P {day.totals.protein}g • C {day.totals.carbs}g • F {day.totals.fat}g</div>
                                                            </div>
                                                            <div className="text-[#646D67]">
                                                                {isExpanded ? <ChevronUp className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {isExpanded && (
                                                        <div className="px-5 pb-5 pt-3 border-t border-[#F0EFEA] bg-[#FAF9F6] space-y-4">
                                                            {day.factors.length > 0 && (
                                                                <div className="space-y-1.5">
                                                                    <div className="text-[11px] font-semibold uppercase tracking-wider text-[#646D67]">Key Contributing Factors</div>
                                                                    <ul className="space-y-1 text-xs text-[#646D67]">
                                                                        {day.factors.map((f, idx) => (
                                                                            <li key={idx}><strong className="text-[#1C2520] font-medium">{f.label}:</strong> {f.detail}</li>
                                                                        ))}
                                                                    </ul>
                                                                </div>
                                                            )}
                                                            <div className="space-y-2">
                                                                <div className="text-[11px] font-semibold uppercase tracking-wider text-[#646D67]">Logged Meals</div>
                                                                {day.meals.map(m => (
                                                                    <div key={m.id} className="p-3 rounded-xl bg-white border border-[#E6E4DC] flex items-center justify-between text-xs">
                                                                        <div>
                                                                            <span className="font-semibold text-[#1C2520]">{m.mealTitle}</span>
                                                                            <span className="text-[#646D67] ml-2">({m.cookingStyle})</span>
                                                                        </div>
                                                                        <div className="text-[#646D67] font-medium">{m.totals?.calories} kcal</div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                                <p className="text-center text-xs text-[#646D67] pt-2">Entries are automatically kept for 14 days.</p>
                            </main>
                        )}

                        {/* ================= VIEW 5: GOALS ================= */}
                        {activeTab === 'goals' && (
                            <main className="space-y-4">
                                <form onSubmit={handleSaveGoalsForm} className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm space-y-5">
                                    <div>
                                        <h2 className="text-sm font-semibold text-[#1C2520]">Daily Nutritional Targets</h2>
                                        <p className="text-xs text-[#646D67] mt-0.5">Set your daily energy and macro thresholds for scoreboard tracking</p>
                                    </div>

                                    {goalSavedMessage && (
                                        <div className="p-3 rounded-xl bg-[#EAF0EC] text-[#2D5A43] text-xs font-medium flex items-center gap-2">
                                            <Check className="w-4 h-4" />
                                            <span>Goals updated successfully!</span>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Calories (kcal)</label>
                                            <input type="number" value={goalCalories} onChange={(e) => setGoalCalories(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Protein (g)</label>
                                            <input type="number" value={goalProtein} onChange={(e) => setGoalProtein(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Carbohydrates (g)</label>
                                            <input type="number" value={goalCarbs} onChange={(e) => setGoalCarbs(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Total Fat (g)</label>
                                            <input type="number" value={goalFat} onChange={(e) => setGoalFat(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Saturated Fat (g)</label>
                                            <input type="number" value={goalSatFat} onChange={(e) => setGoalSatFat(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Sodium (mg)</label>
                                            <input type="number" value={goalSodium} onChange={(e) => setGoalSodium(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                    </div>

                                    <div className="pt-2 flex justify-end">
                                        <button type="submit" className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-[#2D5A43] hover:bg-[#234735] text-white text-xs font-semibold transition flex items-center justify-center gap-1.5">
                                            <Check className="w-4 h-4" />
                                            <span>Save Targets</span>
                                        </button>
                                    </div>
                                </form>
                            </main>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
