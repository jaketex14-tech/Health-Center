                                        </div>
                                        <span className="text-[11px] text-[#646D67] block mt-0.5">
                                            {sortedWeights.length} {sortedWeights.length === 1 ? 'weigh-in' : 'weigh-ins'}
                                        </span>
                                    </div>
                                </section>

                                {/* 14-Day Weight Trend Sparkline Card */}
                                {sortedWeights.length > 0 && (
                                    <section className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm space-y-3">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <h2 className="text-sm font-semibold text-[#1C2520]">14-Day Weight Progression</h2>
                                                <p className="text-xs text-[#646D67]">Mindful trendline normalized in {weightUnit}</p>
                                            </div>
                                            <div className="inline-flex rounded-xl bg-[#F6F5F0] p-0.5 border border-[#E6E4DC]">
                                                {['lbs', 'kg'].map(u => (
                                                    <button
                                                        key={u}
                                                        type="button"
                                                        onClick={() => setWeightUnit(u)}
                                                        className={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                                                            weightUnit === u
                                                                ? 'bg-[#2D5A43] text-white'
                                                                : 'text-[#646D67] hover:text-[#1C2520]'
                                                        }`}
                                                    >
                                                        {u}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <WeightTrendSparkline entries={sortedWeights} displayUnit={weightUnit} />
                                    </section>
                                )}

                                {/* Quick Weigh-In Logger Card */}
                                <form onSubmit={handleSaveWeight} className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm space-y-5">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h2 className="text-sm font-semibold text-[#1C2520]">Quick Weigh-In Logger</h2>
                                            <p className="text-xs text-[#646D67] mt-0.5">Saved to localStorage with automatic 14-day rolling purge</p>
                                        </div>
                                        {weightSavedToast && (
                                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-[#EAF0EC] text-[#2D5A43] text-xs font-medium">
                                                <Check className="w-3.5 h-3.5" />
                                                <span>Saved</span>
                                            </span>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Weight ({weightUnit})</label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    value={currentWeightInput}
                                                    onChange={(e) => setCurrentWeightInput(e.target.value)}
                                                    placeholder={weightUnit === 'lbs' ? 'e.g. 176.0' : 'e.g. 79.8'}
                                                    className="flex-1 p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                                />
                                                <div className="inline-flex rounded-xl bg-[#F6F5F0] p-1 border border-[#E6E4DC]">
                                                    {['lbs', 'kg'].map(u => (
                                                        <button
                                                            key={u}
                                                            type="button"
                                                            onClick={() => setWeightUnit(u)}
                                                            className={`px-3 rounded-lg text-xs font-semibold transition ${
                                                                weightUnit === u
                                                                    ? 'bg-[#2D5A43] text-white'
                                                                    : 'text-[#646D67] hover:text-[#1C2520]'
                                                            }`}
                                                        >
                                                            {u}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Date (Last 14 Days)</label>
                                            <input
                                                type="date"
                                                min={minDateStr}
                                                max={todayDateStr}
                                                value={weightDateInput}
                                                onChange={(e) => setWeightDateInput(e.target.value)}
                                                className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                            />
                                        </div>
                                    </div>

                                    {/* Condition Pills */}
                                    <div className="space-y-2">
                                        <label className="block text-xs font-medium text-[#646D67]">Time of Day / Condition</label>
                                        <div className="flex flex-wrap gap-2">
                                            {WEIGH_IN_CONDITIONS.map(cond => (
                                                <button
                                                    key={cond}
                                                    type="button"
                                                    onClick={() => setWeightCondition(cond)}
                                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-medium transition border ${
                                                        weightCondition === cond
                                                            ? 'bg-[#2D5A43] text-white border-[#2D5A43]'
                                                            : 'bg-[#F6F5F0] text-[#1C2520] border-[#E6E4DC] hover:bg-[#EAE8E0]'
                                                    }`}
                                                >
                                                    {cond}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Optional brief note */}
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-medium text-[#646D67]">Brief Note (Optional)</label>
                                        <input
                                            type="text"
                                            value={weightNote}
                                            onChange={(e) => setWeightNote(e.target.value)}
                                            placeholder="e.g., Hydrated, post-cardio session, high-sodium dinner yesterday"
                                            className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={!currentWeightInput}
                                        className="w-full py-3 px-4 rounded-xl bg-[#2D5A43] hover:bg-[#234735] disabled:opacity-50 text-white text-xs font-semibold tracking-wide transition flex items-center justify-center gap-2"
                                    >
                                        <Check className="w-4 h-4" />
                                        <span>Save Weigh-In</span>
                                    </button>
                                </form>

                                {/* Chronological Weigh-In History List */}
                                <section className="space-y-3">
                                    <h2 className="text-xs font-semibold uppercase tracking-wider text-[#646D67] px-1">
                                        Logged Weigh-Ins (Past 14 Days)
                                    </h2>
                                    {sortedWeights.length === 0 ? (
                                        <div className="bg-white rounded-2xl border border-[#E6E4DC] p-8 text-center">
                                            <p className="text-sm text-[#646D67]">No weigh-ins recorded in the last 14 days.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {sortedWeights.map(w => (
                                                <div key={w.id} className="bg-white rounded-2xl border border-[#E6E4DC] p-4 sm:px-5 flex items-center justify-between gap-4 text-xs">
                                                    <div className="space-y-1 min-w-0">
                                                        <div className="flex flex-wrap items-center gap-2">
                                                            <span className="font-semibold text-[#1C2520]">{formatReadableDate(w.dateKey)}</span>
                                                            <span className="text-[#646D67]">({w.dateKey})</span>
                                                            {w.condition && (
                                                                <span className="px-2 py-0.5 rounded-md bg-[#EAF0EC] text-[#2D5A43] text-[11px] font-medium">
                                                                    {w.condition}
                                                                </span>
                                                            )}
                                                        </div>
                                                        {w.note && (
                                                            <p className="text-[#646D67] truncate">{w.note}</p>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-3 shrink-0">
                                                        <span className="text-sm font-semibold text-[#2D5A43]">
                                                            {convertWeight(w.weight, w.unit || 'lbs', weightUnit)} {weightUnit}
                                                        </span>
                                                        <button
                                                            onClick={() => handleDeleteWeight(w.id)}
                                                            className="p-1.5 rounded-lg text-[#646D67] hover:text-[#B55A44] hover:bg-[#F6F5F0] transition"
                                                            title="Delete weigh-in"
                                                        >
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>
                            </main>
                        )}

                        {/* ================= VIEW 4: 14-DAY HISTORY ================= */}
                        {activeTab === 'history' && (
                            <main className="space-y-4">
                                {historyDays.length === 0 ? (
                                    <div className="bg-white rounded-2xl border border-[#E6E4DC] p-8 text-center">
                                        <p className="text-sm text-[#646D67]">No meal history recorded yet.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {historyDays.map(day => {
                                            const isExpanded = expandedHistoryDate === day.dateKey;
                                            return (
                                                <div key={day.dateKey} className="bg-white rounded-2xl border border-[#E6E4DC] overflow-hidden transition">
                                                    <div onClick={() => setExpandedHistoryDate(isExpanded ? null : day.dateKey)} className="p-5 cursor-pointer hover:bg-[#FAF9F6] transition flex items-center justify-between gap-4">
                                                        <div className="space-y-1 min-w-0">
                                                            <div className="flex flex-wrap items-center gap-2">
                                                                <span className="text-sm font-semibold text-[#1C2520]">{day.readableDate}</span>
                                                                <span className="text-xs text-[#646D67]">({day.meals.length} {day.meals.length === 1 ? 'meal' : 'meals'})</span>
                                                                {day.weighIn && (
                                                                    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-[#EAF0EC] text-[#2D5A43] text-[11px] font-medium">
                                                                        <Scale className="w-3 h-3" />
                                                                        <span>{day.weighIn.weight} {day.weighIn.unit}</span>
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="text-xs text-[#646D67] truncate max-w-md">
                                                                {day.meals.map(m => m.mealTitle).join(' • ')}
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4 shrink-0">
                                                            <div className="text-right">
                                                                <div className="text-sm font-semibold text-[#1C2520]">{formatNum(day.totals.calories)} kcal</div>
                                                                <div className="text-[11px] text-[#646D67]">P {safeNum(day.totals.protein)}g • C {safeNum(day.totals.carbs)}g • F {safeNum(day.totals.fat)}g</div>
                                                            </div>
                                                            <div className="text-[#646D67]">
                                                                {isExpanded ? <ChevronUp className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {isExpanded && (
                                                        <div className="px-5 pb-5 pt-3 border-t border-[#F0EFEA] bg-[#FAF9F6] space-y-4">
                                                            {day.factors.length > 0 && (
                                                                <div className="space-y-1.5">
                                                                    <div className="text-[11px] font-semibold uppercase tracking-wider text-[#646D67]">Key Contributing Factors</div>
                                                                    <ul className="space-y-1 text-xs text-[#646D67]">
                                                                        {day.factors.map((f, idx) => (
                                                                            <li key={idx}><strong className="text-[#1C2520] font-medium">{f.label}:</strong> {f.detail}</li>
                                                                        ))}
                                                                    </ul>
                                                                </div>
                                                            )}
                                                            <div className="space-y-2">
                                                                <div className="text-[11px] font-semibold uppercase tracking-wider text-[#646D67]">Logged Meals</div>
                                                                {day.meals.map(m => (
                                                                    <div key={m.id} className="p-3 rounded-xl bg-white border border-[#E6E4DC] flex items-center justify-between text-xs">
                                                                        <div>
                                                                            <span className="font-semibold text-[#1C2520]">{m.mealTitle}</span>
                                                                            <span className="text-[#646D67] ml-2">({m.cookingStyle})</span>
                                                                        </div>
                                                                        <div className="text-[#646D67] font-medium">{m.totals?.calories} kcal</div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                                <p className="text-center text-xs text-[#646D67] pt-2">Meals and weigh-ins are automatically kept for 14 days.</p>
                            </main>
                        )}

                        {/* ================= VIEW 5: MACRO GOALS & PWA ICON SETTINGS ================= */}
                        {activeTab === 'goals' && (
                            <main className="space-y-6">
                                <form onSubmit={handleSaveGoalsForm} className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm space-y-5">
                                    <div>
                                        <h2 className="text-sm font-semibold text-[#1C2520]">Daily Nutritional Targets</h2>
                                        <p className="text-xs text-[#646D67] mt-0.5">Set your daily energy and macro thresholds for scoreboard tracking</p>
                                    </div>

                                    {goalSavedMessage && (
                                        <div className="p-3 rounded-xl bg-[#EAF0EC] text-[#2D5A43] text-xs font-medium flex items-center gap-2">
                                            <Check className="w-4 h-4" />
                                            <span>Goals updated successfully!</span>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Calories (kcal)</label>
                                            <input type="number" value={goalCalories} onChange={(e) => setGoalCalories(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Protein (g)</label>
                                            <input type="number" value={goalProtein} onChange={(e) => setGoalProtein(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Carbohydrates (g)</label>
                                            <input type="number" value={goalCarbs} onChange={(e) => setGoalCarbs(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Total Fat (g)</label>
                                            <input type="number" value={goalFat} onChange={(e) => setGoalFat(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Saturated Fat (g)</label>
                                            <input type="number" value={goalSatFat} onChange={(e) => setGoalSatFat(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-medium text-[#646D67]">Sodium (mg)</label>
                                            <input type="number" value={goalSodium} onChange={(e) => setGoalSodium(e.target.value)} className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]" />
                                        </div>
                                    </div>

                                    <div className="pt-3 border-t border-[#F0EFEA] space-y-1.5">
                                        <label className="text-xs font-medium text-[#646D67]">Optional Gemini API Key (Leave blank for instant offline USDA analyzer)</label>
                                        <input
                                            type="password"
                                            value={customApiKey}
                                            onChange={(e) => setCustomApiKey(e.target.value)}
                                            placeholder="Optional AI key — works 100% offline without a key"
                                            className="w-full p-3 rounded-xl bg-[#F6F5F0] border border-[#E6E4DC] focus:border-[#2D5A43] focus:bg-white focus:outline-none text-xs text-[#1C2520]"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end">
                                        <button type="submit" className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-[#2D5A43] hover:bg-[#234735] text-white text-xs font-semibold transition flex items-center justify-center gap-1.5">
                                            <Check className="w-4 h-4" />
                                            <span>Save Targets</span>
                                        </button>
                                    </div>
                                </form>

                                {/* Home Screen Icon Preview & PWA Install Readiness Card */}
                                <section className="bg-white rounded-2xl border border-[#E6E4DC] p-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                    <div className="flex items-center gap-4">
                                        {PWA_ASSETS.icon512 && (
                                            <img
                                                src={PWA_ASSETS.icon512}
                                                alt="NutriTrack Home Screen Icon"
                                                className="w-14 h-14 rounded-2xl shadow-sm border border-[#E6E4DC]"
                                            />
                                        )}
                                        <div className="space-y-1">
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-sm font-semibold text-[#1C2520]">Android & iOS Home Screen Icon</h3>
                                                <span className="px-2 py-0.5 rounded-full bg-[#EAF0EC] text-[#2D5A43] text-[10px] font-semibold">
                                                    512×512 PNG Ready
                                                </span>
                                            </div>
                                            <p className="text-xs text-[#646D67]">
                                                Use Chrome&apos;s &ldquo;Add to Home screen&rdquo; on GitHub Pages to install NutriTrack with this custom icon.
                                            </p>
                                        </div>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={handleDownloadIconPng}
                                        className="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-[#F6F5F0] hover:bg-[#EAE8E0] border border-[#E6E4DC] text-[#1C2520] text-xs font-semibold transition flex items-center justify-center gap-1.5 shrink-0"
                                    >
                                        <Download className="w-4 h-4 text-[#2D5A43]" />
                                        <span>Download Icon PNG</span>
                                    </button>
                                </section>
                            </main>
                        )}
                    </div>

                    {/* Bottom Mobile Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-[#E6E4DC] z-30">
                        <div className="max-w-2xl mx-auto px-2 py-1.5 grid grid-cols-5 gap-1">
                            {[
                                { id: 'today', label: 'Today', icon: Home },
                                { id: 'log', label: 'Log Meal', icon: Utensils },
                                { id: 'weight', label: 'Weigh-In', icon: Scale },
                                { id: 'history', label: '14d History', icon: Clock },
                                { id: 'goals', label: 'Goals', icon: Sliders }
                            ].map(item => {
                                const Icon = item.icon;
                                const isActive = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => setActiveTab(item.id)}
                                        className={`flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-medium transition ${
                                            isActive ? 'text-[#2D5A43] bg-[#EAF0EC]/70' : 'text-[#646D67] hover:text-[#1C2520]'
                                        }`}
                                    >
                                        <Icon className="w-4 h-4 mb-0.5" />
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
